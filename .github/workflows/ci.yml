name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Regression Benchmarks & Unit Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install Scientific Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install -r requirements.txt

    - name: Run Unit Test Suite
      run: |
        python -m unittest discover -s tests -p "test_*.py"

    - name: Run Empirical Convergence Verification
      run: |
        python benchmarks/convergence_tests.py

    - name: Run Destructive Stability Scans
      run: |
        python benchmarks/cfl_stability_scan.py

    - name: Smoke Test Benchmark Suite
      run: |
        python benchmarks/run_all_benchmarks.py
